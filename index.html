<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contador de Dias Trabalhados</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #121212;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: #1e1e1e;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      max-width: 450px;
      width: 100%;
    }

    h1 {
      text-align: center;
      font-size: 1.4rem;
      margin-bottom: 20px;
      color: #ffffff;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    select, input[type="number"] {
      background-color: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      padding: 8px 12px;
      border-radius: 6px;
      outline: none;
      font-size: 1rem;
    }

    .counters {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .card {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
    }

    .card.trabalhados {
      background-color: rgba(46, 125, 50, 0.2);
      border: 1px solid #2e7d32;
    }

    .card.folgas {
      background-color: rgba(198, 40, 40, 0.2);
      border: 1px solid #c62828;
    }

    .card span {
      display: block;
      font-size: 1.5rem;
      font-weight: bold;
      margin-top: 5px;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-weight: bold;
      color: #888;
      margin-bottom: 8px;
      font-size: 0.85rem;
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #2a2a2a;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
      font-weight: 500;
      transition: background-color 0.2s, transform 0.1s;
    }

    .day:hover {
      transform: scale(1.05);
    }

    .day.empty {
      background-color: transparent;
      cursor: default;
    }

    .day.trabalhou {
      background-color: #2e7d32;
      color: #fff;
    }

    .day.nao-trabalhou {
      background-color: #c62828;
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Controle de Dias Trabalhados</h1>

    <div class="controls">
      <select id="monthSelect"></select>
      <input type="number" id="yearInput" min="2000" max="2100">
    </div>

    <div class="counters">
      <div class="card trabalhados">
        Trabalhados
        <span id="workCount">0</span>
      </div>
      <div class="card folgas">
        Não Trabalhados
        <span id="offCount">0</span>
      </div>
    </div>

    <div class="weekdays">
      <div>Dom</div><div>Seg</div><div>Ter</div><div>Qua</div><div>Qui</div><div>Sex</div><div>Sáb</div>
    </div>

    <div class="calendar" id="calendar"></div>
  </div>

  <script>
    const monthSelect = document.getElementById('monthSelect');
    const yearInput = document.getElementById('yearInput');
    const calendar = document.getElementById('calendar');
    const workCountEl = document.getElementById('workCount');
    const offCountEl = document.getElementById('offCount');

    const monthNames = [
      "Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho",
      "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"
    ];

    const date = new Date();
    let currentMonth = date.getMonth();
    let currentYear = date.getFullYear();

    monthNames.forEach((month, index) => {
      const option = document.createElement('option');
      option.value = index;
      option.textContent = month;
      if (index === currentMonth) option.selected = true;
      monthSelect.appendChild(option);
    });

    yearInput.value = currentYear;

    function getStorageKey(year, month) {
      return `work_tracker_${year}_${month}`;
    }

    function loadData(year, month) {
      const saved = localStorage.getItem(getStorageKey(year, month));
      return saved ? JSON.parse(saved) : {};
    }

    function saveData(year, month, data) {
      localStorage.setItem(getStorageKey(year, month), JSON.stringify(data));
    }

    function renderCalendar() {
      calendar.innerHTML = '';
      const daysData = loadData(currentYear, currentMonth);

      const firstDay = new Date(currentYear, currentMonth, 1).getDay();
      const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.classList.add('day', 'empty');
        calendar.appendChild(emptyCell);
      }

      let workCount = 0;
      let offCount = 0;

      for (let day = 1; day <= totalDays; day++) {
        const dayEl = document.createElement('div');
        dayEl.classList.add('day');
        dayEl.textContent = day;

        const status = daysData[day];
        if (status === 'trabalhou') {
          dayEl.classList.add('trabalhou');
          workCount++;
        } else if (status === 'nao-trabalhou') {
          dayEl.classList.add('nao-trabalhou');
          offCount++;
        }

        dayEl.addEventListener('click', () => {
          if (!daysData[day]) {
            daysData[day] = 'trabalhou';
          } else if (daysData[day] === 'trabalhou') {
            daysData[day] = 'nao-trabalhou';
          } else {
            delete daysData[day];
          }

          saveData(currentYear, currentMonth, daysData);
          renderCalendar();
        });

        calendar.appendChild(dayEl);
      }

      workCountEl.textContent = workCount;
      offCountEl.textContent = offCount;
    }

    monthSelect.addEventListener('change', (e) => {
      currentMonth = parseInt(e.target.value);
      renderCalendar();
    });

    yearInput.addEventListener('input', (e) => {
      const val = parseInt(e.target.value);
      if (val >= 2000 && val <= 2100) {
        currentYear = val;
        renderCalendar();
      }
    });

    renderCalendar();
  </script>
</body>
</html>
